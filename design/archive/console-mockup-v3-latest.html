apps.forEach((a,k)=>{const t=document.createElement('div');t.className='tile';t.style.background='linear-gradient(135deg,'+a.c[0]+','+a.c[1]+')';t.innerHTML=I[a.i];t.onclick=()=>{if(menu()||appOpen)return;k===idx?launch(idx):go(k)};track.appendChild(t)});
